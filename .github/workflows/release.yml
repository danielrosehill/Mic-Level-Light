name: release
on:
  push: {branches: [main], tags: ['v*']}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -yq python3-numpy python3-pytest
      - run: PYTHONPATH=. /usr/bin/python3 -m pytest -q
      - run: ./build-deb.sh
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes
        env: {GH_TOKEN: '${{ github.token }}'}
